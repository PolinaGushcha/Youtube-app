<app-header
  (shareData)="getData($event)"
  (shareIsLoading)="getIsLoading($event)"
  (shareSortType)="getSortType($event)"
  (shareUpAndDownArrow)="getUpAndDownArrow($event)"
  (shareSortText)="getSortText($event)"></app-header>

<div class="app-shell">
  <nav class="sidebar">
    <a class="sidebar-item" routerLink="/layout" routerLinkActive="sidebar-item-active" [routerLinkActiveOptions]="{ exact: true }">
      <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 11.5 12 4l9 7.5" />
        <path d="M5 10v9.5a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10" />
      </svg>
      <span>Home</span>
    </a>
    <a class="sidebar-item" routerLink="/layout/favorite" routerLinkActive="sidebar-item-active">
      <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path
          d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z" />
      </svg>
      <span>Favorites</span>
    </a>
    <a class="sidebar-item" routerLink="/layout/create-card" routerLinkActive="sidebar-item-active">
      <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 8v8M8 12h8" />
      </svg>
      <span>Admin</span>
    </a>
  </nav>

  <div class="main-content">
    <div class="loading-state" *ngIf="isLoading() && (showItemComponent || showFavoriteComponent || showCreateCardComponent)">
      <h3>Loading…</h3>
    </div>

    <section *ngIf="!isLoading() && showItemComponent && !showFavoriteComponent && !showCreateCardComponent">
      <div class="search-results">
        <div *ngFor="let card of paginatedItems" class="card">
          <div class="card-container" [ngClass]="getColorClass(card.snippet.publishedAt)">
            <div class="card-thumb" (click)="navigateToRoute(card.id.videoId)">
              <img class="card-img" src="{{ card.snippet.thumbnails.medium.url }}" alt="{{ card.id.videoId }}" />
              <button (click)="addOrRemoveFavoriteCard(card); $event.stopPropagation()" class="likeBtn">
                <app-heart [isLiked]="card.isLiked" />
              </button>
              <button (click)="navigateToRoute(card.id.videoId)" class="card-button">Watch</button>
            </div>
            <h3 class="card-title" (click)="navigateToRoute(card.id.videoId)">{{ card.snippet.title }}</h3>
            <ul class="card-ul">
              <li class="card-li">
                <img src="/viewed.svg" alt="viewed" />
                <p class="card-text">{{ card.items[0].statistics?.viewCount }}</p>
              </li>
              <li class="card-li">
                <img src="/liked.svg" alt="liked" />
                <p class="card-text">{{ card.items[0].statistics?.likeCount }}</p>
              </li>
              <li class="card-li">
                <img src="/comments.svg" alt="comments" />
                <p class="card-text">{{ card.items[0].statistics?.commentCount }}</p>
              </li>
            </ul>
          </div>
        </div>
      </div>
      <app-pagination
        [totalItems]="30"
        [itemsPerPage]="itemsPerPage"
        [currentPage]="currentPage"
        (currentPageChangeEvent)="onPageChanged($event)">
      </app-pagination>
    </section>

    <router-outlet />
  </div>
</div>
