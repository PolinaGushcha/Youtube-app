<header class="header">
  <div class="container">
    <nav class="nav">
      <div class="search-container">
        <button (click)="deleteSearchingText()" [routerLink]="['/']" routerLinkActive="active" class="logo-button">
          <img src="/logo.svg" alt="Logo" />
        </button>
        <div class="search-bar">
          <input
            class="search-input"
            type="text"
            placeholder="What are you want to find out?"
            [(ngModel)]="searchingText" />
          <button
            (click)="getSerchingText(searchingText)"
            [routerLink]="['/results']"
            routerLinkActive="active"
            class="search-button">
            search
          </button>
        </div>
        <button class="settings-button" (click)="toggleSortComponent()">
          <img src="/sort.svg" alt="Settings" />
        </button>
      </div>
      <div class="user-info">
        <p>Your Name</p>
        <img src="/user.svg" alt="User Icon" class="user-icon" />
      </div>
    </nav>
  </div>
</header>

<div *ngIf="displaySortCpmponent" class="text-block">
  <section class="aside">
    <div class="container">
      <div class="section">
        <p class="sort-text">Sorting by:</p>
        <div class="sort-list">
          <button (click)="handleSortObj('date')">date</button>
          <button (click)="handleSortObj('countOfViews')">count of views</button>
          <button (click)="handleSortObj('byWordOrSentance')">by word or sentance</button>
        </div>
        <input class="sort-input" type="text" name="" id="" />
      </div>
    </div>
  </section>
</div>
